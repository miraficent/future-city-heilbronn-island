# Holt jeden Morgen die Veranstaltungen neu (scripts/events/) und committet events.json,
# aber nur wenn sich etwas geändert hat. Der Hoster (z. B. Vercel/Netlify) baut dann automatisch neu.
# Manuell starten: GitHub → Actions → "Update events" → Run workflow.
name: Update events

on:
  schedule:
    - cron: "0 5 * * *" # täglich 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Events abrufen und anreichern
        env:
          # Ohne Secret läuft die Pipeline trotzdem (Stichwort-Zuordnung, alles zur Prüfung markiert)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run events:update
      - name: Nur bei Änderungen committen
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add src/data/events.json scripts/events/cache.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "chore(events): Veranstaltungen aktualisiert"
            git push
          fi
